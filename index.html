<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COS Photography Contest</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body>
    <header class="container">
      <h1>COS Photography Contest</h1>
      <p>Click 3 photos in order. First click gives 2 points. Second and third give 1 point each.</p>
      <nav>
        <a href="./index.html" aria-current="page">Vote</a>
      </nav>
    </header>

    <main class="container">
      <section>
        <h2>Gallery</h2>
        <p id="status" class="status" aria-live="polite"></p>
        <div id="gallery" class="gallery"></div>
      </section>

      <section class="vote-panel">
        <h2>Your selection</h2>
        <div id="selection-summary" class="help">No photos selected yet.</div>
        <button id="submit-vote" type="button">Submit vote</button>
        <p class="help">Only 1 vote per browser is allowed (local token). Click a selected photo again to unselect it.</p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/config.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
