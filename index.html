<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COS Photography Contest</title>
    <link rel="stylesheet" href="./assets/css/styles.css?v=3" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <img src="./assets/img/cos-logo.png" alt="COS logo" class="cos-logo" />
        <div class="topbar__text">
          <h1>COS - Spring Photography Contest</h1>
          <p>Choose your favorite picture and 2 additional if you want.</p>
        </div>
      </div>
    </header>

    <main class="viewer-layout">
      <section class="viewer" aria-label="Photo viewer">
        <div class="viewer__header">
          <p id="status" class="status" aria-live="polite"></p>
        </div>

        <div class="photo-stage">
          <img id="main-photo" src="" alt="" />
        </div>

        <div class="photo-nav">
          <button id="prev-btn" class="nav-btn nav-btn--left" aria-label="Previous photo">‹</button>
          <button id="next-btn" class="nav-btn nav-btn--right" aria-label="Next photo">›</button>
        </div>

        <div class="photo-meta">
          <h2 id="photo-title">Loading...</h2>
          <p id="photo-counter" class="photo-counter muted"></p>
        </div>

        <div class="actions">
          <button id="pick-btn" type="button">Add to Top 3</button>
          <button id="remove-btn" type="button" class="secondary">Remove from Top 3</button>
          <button id="submit-vote" type="button" class="success">Submit Vote</button>
        </div>
      </section>

      <aside class="sidebar" aria-label="Your top 3">
        <div class="sidebar__head">
          <h3>Your Top 3</h3>
          <p class="muted">Order matters: 1st gets 2 points, 2nd and 3rd get 1 point.</p>
        </div>

        <div id="top3-list" class="top3-list">
          <div class="slot" data-rank="1">
            <span class="slot-rank">1st</span>
            <div class="slot-empty">No photo selected</div>
          </div>
          <div class="slot" data-rank="2">
            <span class="slot-rank">2nd</span>
            <div class="slot-empty">No photo selected</div>
          </div>
          <div class="slot" data-rank="3">
            <span class="slot-rank">3rd</span>
            <div class="slot-empty">No photo selected</div>
          </div>
        </div>

        <p class="muted small">You can submit only once per browser.</p>
      </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/config.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
